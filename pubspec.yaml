name: kds_app
description: Khilkhet Delivery Service mobile-first Flutter MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - kds-logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "kds-logo.jpeg"
  windows:
    generate: true
    image_path: "kds-logo.jpeg"
    icon_size: 48
  web:
    generate: true
    image_path: "kds-logo.jpeg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "kds-logo.jpeg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "kds-logo.jpeg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: kds-logo.jpeg
  android_12:
    color: "#ffffff"
    image: kds-logo.jpeg
    icon_background_color: "#ffffff"
